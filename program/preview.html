<!DOCTYPE html>
<html lang="es">
<head>

<title>SOFTX — Preview</title>
<link rel="icon" type="image/png" sizes="64x64" href="/assets/images/gla-favicon.png" />
<link rel="stylesheet" href="css/theme.css?v=2" />
<link rel="stylesheet" href="css/overlay.css?v=24" />

<body>
<!-- Preview independiente del Program real (2026-09-26, pedido explicito,
     seccion 7): esta pagina NUNCA es el output real que alimenta vMix --
     ese sigue siendo /program (program/index.html + program/js/main.js).
     Es una copia deliberada de la estructura de modulos de program/index.html
     (mismos "#mod-<id>" con ".content" adentro, mismos CSS) para poder
     reusar los renderers de program/js/renderers/*.js tal cual, sin
     duplicar su logica -- ver program/js/preview-main.js, que es un bus
     visual propio y mucho mas simple (sin Hot Pool/Take Scheduler/tickers:
     el preview solo necesita mostrar el draft actual de UN modulo a la vez,
     no sostener produccion real). -->
<div id="stage">
  <div id="mod-marcadorZocalo" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-marcadorTiempoAdicional" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-scoreboard" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <div id="mod-tarjeta" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <div id="mod-vs" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-zocaloVs" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

       Orden = capas: las placas de pantalla completa (VS, Formación) tapan al
       Marcador y a la Tarjeta, que siguen al aire y reaparecen al salir. -->
