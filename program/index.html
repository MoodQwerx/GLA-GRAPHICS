<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>LIVE GRAPHICS — Program / Overlay</title>
<link rel="icon" type="image/png" sizes="64x64" href="/assets/images/gla-favicon.png" />
<link rel="stylesheet" href="css/theme.css?v=2" />
<link rel="stylesheet" href="css/overlay.css?v=24" />
</head>
<body>
<div id="stage">
  <!-- Marcador -->
  <!-- Marcador Zocalo y Tiempo Adicional van ANTES que el marcador
       principal a proposito: el orden de estos nodos define el apilado
       real (ver docs/ARCHITECTURE.md), y ambos tienen que quedar DETRAS
       del marcador principal (que los "pisa" donde se superponen — ver
       program/css/overlay.css). Tiempo Adicional se movio aca (2026-09-04,
       pedido explicito del usuario, Argentina Streamers) despues de que su
       posicion guardada paso a superponerse con el marcador principal --
       antes no hacia falta este orden porque no se pisaban. Solo cambia el
       orden DOM (asi el navegador lo apila abajo sin tocar CSS/z-index
       nuevo); X/Y/Scale guardados del modulo no se tocaron. -->
  <div id="mod-marcadorZocalo" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-marcadorTiempoAdicional" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-scoreboard" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-marcadorEntretiempo" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-marcadorPenales" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- Placas -->
  <div id="mod-formacionEquipos" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-vsPrepartido" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-vsResultado" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- Eventos -->
  <div id="mod-tarjeta" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-cambios" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-gol" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- VAR / Replay -->
  <div id="mod-varCheck" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-replay" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- Mosca -->
  <div id="mod-bug" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- Zocalos -->
  <!-- Zocalo largo simple DESACTIVADO TEMPORALMENTE (falta reemplazar el
       asset) junto con su entrada en shared/modules.js y su registro en
       program/js/renderers/index.js — descomentar este nodo y esos dos
       registros para reactivar.
  <div id="mod-longSimple" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  -->
  <div id="mod-longDouble" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-shortSimple" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-shortDouble" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-vs" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-zocaloFinalDiv" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-zocaloFinal" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-zocaloCompuesto" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-zocaloCompuestoEquipos" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-zocaloCompuestoLogo" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- Grupos -->
  <div id="mod-grupos" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- Tablas -->
  <div id="mod-sideTable" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-estrellas" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-posiciones" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-posicionesTorneo" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-goleadores" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-asistidores" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-jugadores" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-fichaJugador" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- BRACKETS (2026-09-02, handoff de un agente concurrente -- ver docs/PATCH_SHARED_CLAUDE.md) -->
  <div id="mod-cronogramaHoy" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-resultadosParciales" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-historial" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- Extras (2026-09-02, Argentina Streamers) -->
  <div id="mod-sitioWebPromoL" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
</div>
<script type="module" src="js/main.js?v=10"></script>
</body>
</html>
