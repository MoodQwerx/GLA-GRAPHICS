<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>SOFTX — Program / Overlay</title>
<link rel="icon" type="image/png" sizes="64x64" href="/assets/images/gla-favicon.png" />
<link rel="stylesheet" href="css/theme.css?v=2" />
<link rel="stylesheet" href="css/overlay.css?v=24" />
<link rel="stylesheet" href="css/bb.css" />
<link rel="stylesheet" href="css/c4n.css" />
<link rel="stylesheet" href="css/sc.css" />
</head>
<body>
<div id="stage">
  <!-- Marcador -->
  <!-- Marcador Zocalo y Tiempo Adicional van ANTES que el marcador
       principal a proposito: el orden de estos nodos define el apilado
       real (ver docs/ARCHITECTURE.md), y ambos tienen que quedar DETRAS
       del marcador principal (que los "pisa" donde se superponen — ver
       program/css/overlay.css). Tiempo Adicional se movio aca (2026-09-04,
       pedido explicito del usuario, Argentina Streamers) despues de que su
       posicion guardada paso a superponerse con el marcador principal --
       antes no hacia falta este orden porque no se pisaban. Solo cambia el
       orden DOM (asi el navegador lo apila abajo sin tocar CSS/z-index
       nuevo); X/Y/Scale guardados del modulo no se tocaron. -->
  <div id="mod-marcadorZocalo" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-marcadorTiempoAdicional" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-scoreboard" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-marcadorEntretiempo" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-marcadorPenales" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- Placas -->
  <div id="mod-formacionEquipos" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-vsPrepartido" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-vsResultado" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- Eventos -->
  <div id="mod-tarjeta" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-cambios" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-gol" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- VAR / Replay -->
  <div id="mod-varCheck" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-replay" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- Mosca -->
  <div id="mod-bug" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- Zocalos -->
  <!-- Zocalo largo simple DESACTIVADO TEMPORALMENTE (falta reemplazar el
       asset) junto con su entrada en shared/modules.js y su registro en
       program/js/renderers/index.js — descomentar este nodo y esos dos
       registros para reactivar.
  <div id="mod-longSimple" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  -->
  <div id="mod-longDouble" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-shortSimple" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-shortDouble" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-vs" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-zocaloVs" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-zocaloFinalDiv" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-zocaloFinal" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-zocaloCompuesto" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-zocaloCompuestoEquipos" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-zocaloCompuestoLogo" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- Grupos -->
  <div id="mod-grupos" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- Tablas -->
  <div id="mod-sideTable" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-estrellas" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-posiciones" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-posicionesTorneo" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-goleadores" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-asistidores" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-jugadores" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-fichaJugador" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- CHARTS (SOFTX / GLA): placa estadistica sin asset -->
  <div id="mod-charts" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <!-- BAULETI vs BALANZA (SOFTX [3]): piezas CSS propias, ver css/bb.css.
       Orden = capas: las placas de pantalla completa (VS, Formación, VS
       Resultado, Charts) tapan a las piezas chicas (Marcador, Penales, Gol,
       VAR, Tarjeta, Cambio, Zócalos), que siguen al aire y reaparecen al salir. -->
  <div id="mod-bbMarcador" class="gfx gfx-fullstage bb-root is-hidden"><div class="content"></div></div>
  <div id="mod-bbPenales" class="gfx gfx-fullstage bb-root is-hidden"><div class="content"></div></div>
  <div id="mod-bbGol" class="gfx gfx-fullstage bb-root is-hidden"><div class="content"></div></div>
  <div id="mod-bbVar" class="gfx gfx-fullstage bb-root is-hidden"><div class="content"></div></div>
  <div id="mod-bbTarjeta" class="gfx gfx-fullstage bb-root is-hidden"><div class="content"></div></div>
  <div id="mod-bbCambio" class="gfx gfx-fullstage bb-root is-hidden"><div class="content"></div></div>
  <div id="mod-bbZocaloLargo" class="gfx gfx-fullstage bb-root is-hidden"><div class="content"></div></div>
  <div id="mod-bbZocaloCorto" class="gfx gfx-fullstage bb-root is-hidden"><div class="content"></div></div>
  <div id="mod-bbZocaloCortoDoble" class="gfx gfx-fullstage bb-root is-hidden"><div class="content"></div></div>
  <div id="mod-bbMoscaPdm" class="gfx gfx-fullstage bb-root is-hidden"><div class="content"></div></div>
  <div id="mod-bbVs" class="gfx gfx-fullstage bb-root bb-fs is-hidden"><div class="content"></div></div>
  <div id="mod-bbFormacion" class="gfx gfx-fullstage bb-root bb-fs is-hidden"><div class="content"></div></div>
  <div id="mod-bbVsResultado" class="gfx gfx-fullstage bb-root bb-fs is-hidden"><div class="content"></div></div>
  <div id="mod-bbCharts" class="gfx gfx-fullstage bb-root bb-fs is-hidden"><div class="content"></div></div>
  <div id="mod-bbYaComenzamos" class="gfx gfx-fullstage bb-root bb-fs is-hidden"><div class="content"></div></div>
  <div id="mod-bbGraciasPorVer" class="gfx gfx-fullstage bb-root bb-fs is-hidden"><div class="content"></div></div>
  <!-- COPA 4 NACIONES (SOFTX [4]): capas de contenido + motion, ver css/c4n.css.
       Orden = capas: las placas de pantalla completa tapan a las chicas. -->
  <div id="mod-c4nMarcador" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nMoscaLogo" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nMoscaTexto" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nRotativoSponsors" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nMejoresJugadores" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nTarjeta" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nCambio" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nPenalShootout" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nZocaloTexto" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nZocaloTextoDoble" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nZocaloCorto" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nZocaloCortoDoble" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nZocaloCompuesto" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nSponsors" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nMosca" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nVar" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nGoleadores" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nAsistencias" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nGA" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nPosiciones" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nTablaVs" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nPromoWeb" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nTablaFixture" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <div id="mod-c4nFixture" class="gfx gfx-fullstage c4n-root c4n-fs is-hidden"><div class="content"></div></div>
  <div id="mod-c4nVsPrepartido" class="gfx gfx-fullstage c4n-root c4n-fs is-hidden"><div class="content"></div></div>
  <div id="mod-c4nVsResultado" class="gfx gfx-fullstage c4n-root c4n-fs is-hidden"><div class="content"></div></div>
  <div id="mod-c4nFormacion" class="gfx gfx-fullstage c4n-root c4n-fs is-hidden"><div class="content"></div></div>
  <div id="mod-c4nStatsPrevia" class="gfx gfx-fullstage c4n-root c4n-fs is-hidden"><div class="content"></div></div>
  <div id="mod-c4nStatsEntretiempo" class="gfx gfx-fullstage c4n-root c4n-fs is-hidden"><div class="content"></div></div>
  <div id="mod-c4nStatsFinal" class="gfx gfx-fullstage c4n-root c4n-fs is-hidden"><div class="content"></div></div>
  <div id="mod-c4nDatos" class="gfx gfx-fullstage c4n-root is-hidden"><div class="content"></div></div>
  <!-- GLA SUPERCOPA (SOFTX [5]): capas de contenido + motion, ver css/sc.css.
       Pantalla completa (FIXTURE, FORMACIÓN) debajo; el resto encima. -->
  <div id="mod-scFixture" class="gfx gfx-fullstage sc-root sc-fs is-hidden"><div class="content"></div></div>
  <div id="mod-scFormacion" class="gfx gfx-fullstage sc-root sc-fs is-hidden"><div class="content"></div></div>
  <div id="mod-scPresentacion" class="gfx gfx-fullstage sc-root sc-fs is-hidden"><div class="content"></div></div>
  <div id="mod-scPlacaResultado" class="gfx gfx-fullstage sc-root sc-fs is-hidden"><div class="content"></div></div>
  <div id="mod-scSorteo" class="gfx gfx-fullstage sc-root sc-fs is-hidden"><div class="content"></div></div>
  <!-- MOSCA (v3) DEBAJO de la TABLA L: con la mosca al aire, GRUPOS /
       FIXTURE L la tapan (mismo criterio que COPA 4 NACIONES). -->
  <div id="mod-scMosca" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>
  <!-- L DERECHA (v2): GRUPOS / FIXTURE L, encima de la MOSCA (v3) y debajo del MARCADOR. -->
  <div id="mod-scGrupos" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>
  <div id="mod-scFixtureL" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>
  <div id="mod-scMarcador" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>
  <div id="mod-scTarjeta" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>
  <div id="mod-scCambio" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>
  <div id="mod-scPenalShootout" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>
  <div id="mod-scVar" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>
  <div id="mod-scZocaloCorto" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>
  <div id="mod-scTalentos" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>
  <div id="mod-scZocaloLargo" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>
  <div id="mod-scZocaloL" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>
  <div id="mod-scVsPrepartido" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>
  <div id="mod-scVsResultado" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>
  <div id="mod-scDatos" class="gfx gfx-fullstage sc-root is-hidden"><div class="content"></div></div>

  <!-- BRACKETS (2026-09-02, handoff de un agente concurrente -- ver docs/PATCH_SHARED_CLAUDE.md) -->
  <div id="mod-cronogramaHoy" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-resultadosParciales" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
  <div id="mod-historial" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>

  <!-- Extras (2026-09-02, Argentina Streamers) -->
  <div id="mod-sitioWebPromoL" class="gfx gfx-fullstage is-hidden"><div class="content"></div></div>
</div>
<script type="module" src="js/main.js?v=10"></script>
</body>
</html>
